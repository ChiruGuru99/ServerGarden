name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 — Compile, test, report
  # ─────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          # Caches ~/.m2/repository automatically; invalidated when pom.xml changes
          cache: maven

      # Tests use @ActiveProfiles("native") so no CONFIG_GIT_URI is needed
      - name: Build and run tests
        run: mvn verify --no-transfer-progress

      - name: Upload Surefire test report
        if: always()   # upload even when tests fail so failures are visible
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — Build Docker image; push to Docker Hub only on merges to main.
  #          PRs build the image to catch Dockerfile breakage, but never push.
  #
  # Required GitHub secrets:
  #   DOCKERHUB_USERNAME  — your Docker Hub username
  #   DOCKERHUB_TOKEN     — Docker Hub access token (not your password)
  #                         Generate at: hub.docker.com → Account → Security
  # ─────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test   # only run if tests pass
    environment: devops     # grants access to environment-scoped secrets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx gives us layer caching via GitHub Actions cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Resolve image tags:
      #   • on main  → chiruguru99/sg-config-server:latest
      #              + chiruguru99/sg-config-server:sha-<short-sha>
      #   • on PRs   → chiruguru99/sg-config-server:sha-<short-sha>  (build only)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: chiruguru99/sg-config-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # Login only when we are about to push (skipped for PRs)
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push only on direct pushes to main; PRs only build
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use cached layers between runs — keeps the build fast
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 — OWASP dependency vulnerability scan
  # ─────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            --no-transfer-progress \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            || true   # report findings but don't fail the build yet

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html
          retention-days: 14
